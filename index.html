<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metabolism in Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5;--panel:#FFFFFF;--panel-2:#F5F7FB;--ink:#1A1F3A;--muted:#58608A;--line:#D5DAE6;
  --edge:#B8C0D4;--edge-done:#6B5BB0;--node-bg:#FFFFFF;--node-stroke:#C3CADB;
  --enzyme:#1D6BB5;--enzyme-soft:#DCEAF8;--on-enzyme:#FFFFFF;
  --carbon:#4E3A96;--phosphate:#CF2F6C;--atp:#D99A00;--gtp:#B8740A;--redox:#16895E;
  --water:#2F86CF;--gas:#7C8499;--proton:#8A90A8;--coa:#8B53C4;
  --glyco:#5B3FA0;--gng:#0B7F86;--tca:#B3261E;--good:#16895E;--bad:#C0392B;
  --shadow:0 1px 2px rgba(26,31,58,.06),0 8px 24px rgba(26,31,58,.06);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131832;--panel:#1B2143;--panel-2:#222951;--ink:#E6E9F6;--muted:#A0A8CC;--line:#323B68;
    --edge:#3E4777;--edge-done:#9C8CF0;--node-bg:#232A54;--node-stroke:#434C80;
    --enzyme:#5AA8F0;--enzyme-soft:#1F3560;--on-enzyme:#0E1430;
    --carbon:#B3A5F5;--phosphate:#F2689B;--atp:#F4BE3C;--gtp:#E6A13A;--redox:#43CF96;
    --water:#62B2F2;--gas:#A3AAC0;--proton:#9AA0BC;--coa:#C394F2;
    --glyco:#A898F2;--gng:#3CC6CC;--tca:#F0705F;--good:#43CF96;--bad:#F07A6A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131832;--panel:#1B2143;--panel-2:#222951;--ink:#E6E9F6;--muted:#A0A8CC;--line:#323B68;
  --edge:#3E4777;--edge-done:#9C8CF0;--node-bg:#232A54;--node-stroke:#434C80;
  --enzyme:#5AA8F0;--enzyme-soft:#1F3560;--on-enzyme:#0E1430;
  --carbon:#B3A5F5;--phosphate:#F2689B;--atp:#F4BE3C;--gtp:#E6A13A;--redox:#43CF96;
  --water:#62B2F2;--gas:#A3AAC0;--proton:#9AA0BC;--coa:#C394F2;
  --glyco:#A898F2;--gng:#3CC6CC;--tca:#F0705F;--good:#43CF96;--bad:#F07A6A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--enzyme);outline-offset:2px;border-radius:8px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:20px;padding:10px 24px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;color:var(--ink);text-decoration:none}
.brand svg{width:30px;height:30px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;white-space:nowrap;transition:background .25s,color .25s}
.tabs a i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tabs a:hover{color:var(--ink);background:var(--panel)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.theme-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none}
.theme-btn svg{width:18px;height:18px}

/* ---------- pages ---------- */
.page{display:none;padding:22px 24px 48px;max-width:1500px;margin:0 auto}
.page.on{display:block}
.pw-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 40px;margin-bottom:18px}
.pw-head h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,4.6vw,60px);line-height:.95;letter-spacing:-.025em;margin:0}
.pw-head h1 small{display:block;font-size:.3em;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:10px;line-height:1.4;max-width:62ch;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);max-width:560px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c)}
.legend b.sq{border-radius:3px}
.legend b.ol{background:transparent;border:2px solid var(--c)}

.pw-body{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;align-items:start}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stage .scroll{height:calc(100vh - 200px);min-height:520px;overflow:auto;overscroll-behavior:contain}
.stage svg.map{display:block;width:100%;height:auto;min-width:660px}
.stage-hint{position:absolute;left:14px;bottom:12px;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);padding:5px 10px;border-radius:999px;pointer-events:none}
.bench{position:sticky;top:78px;display:flex;flex-direction:column;gap:12px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:14.5px;transition:transform .12s,background .2s,border-color .2s}
.btn:hover{border-color:var(--enzyme)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;fill:currentColor}
.btn.primary{background:var(--enzyme);border-color:var(--enzyme);color:var(--on-enzyme);min-width:96px}
.btn.icon{width:42px;padding:0}
.speed{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.speed select{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 6px}

/* timeline */
.timeline{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.phase{display:flex;flex-direction:column;gap:5px}
.phase > span{font-size:12px;color:var(--muted);font-weight:700}
.phase .dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);font-weight:700;font-size:13px;cursor:pointer;position:relative;transition:background .3s,border-color .3s,color .3s,transform .2s}
.dot:hover{border-color:var(--enzyme)}
.dot.done{background:var(--enzyme-soft);border-color:var(--enzyme);color:var(--enzyme)}
.dot.now{background:var(--enzyme);border-color:var(--enzyme);color:var(--on-enzyme);transform:translateY(-2px)}
.dot.ctrl::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--atp);border:2px solid var(--panel)}
.dot.branch{border-style:dashed}
.dot.sum{width:auto;padding:0 10px}

/* step card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;box-shadow:var(--shadow);min-height:200px}
.card.swap{animation:cardin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.badge.irr{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.badge.rev{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.badge.ctl{color:var(--ink);background:color-mix(in srgb,var(--atp) 28%,transparent);border-color:transparent}
.badge.byp{color:var(--gng);border-color:var(--gng)}
.card h2{font-family:var(--display);font-size:22px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.card .enz{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card .enz svg{width:34px;height:34px;flex:none}
.card .enz b{display:block;color:var(--enzyme);font-size:16px;line-height:1.2}
.card .enz small{color:var(--muted);font-size:12.5px}
.eqn{font-size:14px;line-height:1.7;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 11px;margin-bottom:10px}
.eqn .arrow{font-weight:700;margin:0 4px}
.cof{font-weight:700;color:var(--c)}
.card p{margin:0 0 8px;font-size:14.5px}
.card p.more{color:var(--muted);font-size:13.5px}
.card .reg{border-left:3px solid var(--atp);padding:6px 10px;background:color-mix(in srgb,var(--atp) 10%,transparent);border-radius:0 10px 10px 0;font-size:13.5px;margin-top:8px}
.card .reg a{color:var(--enzyme);font-weight:700}
.card dl{display:flex;gap:16px;margin:4px 0 8px;font-size:13px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-weight:700}

/* ledger */
.ledger{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ledger h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.ledger-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.lcell{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:13px}
.lcell .nm{font-weight:700;color:var(--c)}
.lcell .v{font-variant-numeric:tabular-nums;font-weight:700}
.lcell .v.pos{color:var(--good)}.lcell .v.neg{color:var(--bad)}
.lcell.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.12);border-color:var(--c)}}

/* ---------- SVG map ---------- */
.edge{fill:none;stroke:var(--edge);stroke-width:2.4;stroke-linecap:round;transition:stroke .4s}
.edge.done{stroke:var(--edge-done)}
.edge.active{stroke:var(--enzyme);stroke-width:3;stroke-dasharray:7 7;animation:flow .7s linear infinite}
.edge.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawin 1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawin{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-14}}
.ah{fill:var(--edge)}.ah.done{fill:var(--edge-done)}.ah.active{fill:var(--enzyme)}
.node{cursor:pointer}
.node .body{transform-box:fill-box;transform-origin:center;transition:opacity .4s}
.node rect{fill:var(--node-bg);stroke:var(--node-stroke);stroke-width:1.5;transition:stroke .4s,fill .4s}
.node text{font:700 14px var(--body);fill:var(--ink)}
.node .x2{font:700 11px var(--body);fill:var(--muted)}
.node:not(.lit) .body{opacity:.5}
.node.lit rect{stroke:var(--carbon)}
.node:hover rect{stroke:var(--enzyme)}
.node.is-sub rect{stroke:var(--enzyme);animation:subpulse 1s ease-in-out infinite}
@keyframes subpulse{50%{stroke-width:4.5}}
.node.pop .body{animation:pop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{35%{transform:scale(1.12)}}
.node.pop rect{fill:color-mix(in srgb,var(--enzyme) 16%,var(--node-bg))}
.bead-c{fill:var(--carbon)}.bead-p{fill:var(--phosphate)}.bead-coa{fill:var(--coa)}
.enz-label{font:700 12.5px var(--body);fill:var(--enzyme);cursor:pointer;transition:opacity .3s}
.enz-label.hide{opacity:0}
.enz-label:hover{text-decoration:underline}
.cof-label{font:12px var(--body);fill:var(--muted);transition:opacity .3s}
.cof-label.hide{opacity:.08}
.cof-label .i{font-weight:700}
.enz-dot{fill:var(--atp)}
.region{fill:none;stroke:var(--line);stroke-width:2}
.region-fill{fill:color-mix(in srgb,var(--gng) 6%,transparent);stroke:color-mix(in srgb,var(--gng) 55%,transparent);stroke-width:2}
.region-inner{fill:none;stroke:color-mix(in srgb,var(--gng) 35%,transparent);stroke-width:1.5;stroke-dasharray:3 5}
.region-label{font:700 13px var(--body);fill:var(--muted)}
.cycle-title{font:800 30px var(--display);fill:var(--ink);letter-spacing:-.02em}
.cycle-sub{font:14px var(--body);fill:var(--muted)}

/* live fx */
.token .core{fill:var(--node-bg);stroke:var(--carbon);stroke-width:2}
.token{pointer-events:none}
.chip{pointer-events:none}
.chip rect{stroke-width:2}
.chip text{font:700 12.5px var(--body)}
.enzyme-live{pointer-events:none}
.enzyme-live .blob{fill:var(--enzyme)}
.enzyme-live .blob-hi{fill:rgba(255,255,255,.22)}
.enzyme-live .ring{fill:none;stroke:var(--enzyme);stroke-width:2;stroke-dasharray:4 6;opacity:.55;transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
.enzyme-live.ctrl .ring{stroke:var(--atp);opacity:.9}
.enzyme-live.working .ring{animation-duration:.8s;opacity:1}
.enzyme-live .pill rect{fill:var(--enzyme)}
.enzyme-live .pill text{font:700 12.5px var(--body);fill:var(--on-enzyme)}
.flash{fill:none;stroke:var(--atp);stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- regulation ---------- */
.reg-grid{display:grid;grid-template-columns:320px minmax(0,1fr) 380px;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--display);font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.panel > p.sub{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.presets button{height:auto;padding:8px 10px;text-align:left;flex-direction:column;align-items:flex-start;gap:0}
.presets button small{font-weight:400;color:var(--muted);font-size:12px}
.presets button.on{border-color:var(--enzyme);background:var(--enzyme-soft)}
.slider{margin-bottom:12px}
.slider label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:2px}
.slider label span{font-weight:400;color:var(--muted);font-size:12.5px}
.slider input{width:100%;accent-color:var(--enzyme);height:24px}
.slider .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-4px}
.flux-wrap{padding:8px}
.flux-wrap svg{display:block;width:100%;height:auto;max-height:calc(100vh - 170px)}
.verdict{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.25;margin:4px 8px 6px;min-height:48px}
.gauge .track{fill:none;stroke:var(--line);stroke-width:6}
.gauge .arc{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.3,.8,.3,1)}
.gauge .pct{font:700 11.5px var(--body);fill:var(--ink)}
.gauge .nm{font:700 13px var(--body);fill:var(--ink)}
.gauge .role{font:11.5px var(--body);fill:var(--muted)}
.gauge{cursor:pointer}
.gauge.hl .track{stroke:var(--enzyme)}
.lab-lane{font:700 14px var(--body)}
.lab-small{font:12px var(--body);fill:var(--muted)}
.lane{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round}
.mnode rect{fill:var(--node-bg);stroke:var(--node-stroke);stroke-width:1.5}
.mnode text{font:700 13.5px var(--body);fill:var(--ink)}
.seesaw line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.seesaw{transition:transform .8s cubic-bezier(.3,1.4,.5,1);transform-box:view-box}
.rgroup h3{font-size:13px;color:var(--c);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.rgroup h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.rgroup:first-child h3{margin-top:0}
.rcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--panel-2);transition:border-color .3s,box-shadow .3s}
.rcard.hl{border-color:var(--enzyme);box-shadow:0 0 0 3px color-mix(in srgb,var(--enzyme) 25%,transparent)}
.rc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rc-top b{font-size:14.5px}
.rc-top span{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .7s cubic-bezier(.3,.8,.3,1)}
.effs{display:flex;flex-wrap:wrap;gap:5px}
.eff{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);transition:all .35s}
.eff.act.on{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good);color:var(--good)}
.eff.inh.on{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:var(--bad);color:var(--bad)}
.rc-note{font-size:12.5px;color:var(--muted);margin:7px 0 0}
.cascade{display:flex;align-items:stretch;gap:6px;margin-top:6px;flex-wrap:wrap}
.cstep{flex:1;min-width:84px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:12.5px}
.cstep b{display:block;font-size:13px}
.cstep .bar{margin:5px 0 0}
.carrow{align-self:center;color:var(--muted);font-weight:700}
.insight p{font-size:14px;margin:0 0 8px;padding-left:12px;border-left:3px solid var(--c,var(--enzyme))}
.foot{color:var(--muted);font-size:12.5px;margin-top:18px}

@media (max-width:1250px){
  .reg-grid{grid-template-columns:300px minmax(0,1fr)}
  .reg-grid .col-right{grid-column:1 / -1}
}
@media (max-width:980px){
  .pw-body{grid-template-columns:1fr}
  .bench{position:static}
  .stage .scroll{height:60vh;min-height:380px}
  .reg-grid{grid-template-columns:1fr}
  .top{padding:8px 12px;gap:10px}
  .brand span{display:none}
  .page{padding:16px 12px 40px}
}
@media (prefers-reduced-motion:reduce){
  .edge.active,.enzyme-live .ring,.node.is-sub rect{animation:none}
  .card.swap{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/glycolysis" aria-label="Metabolism in Motion home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a13 13 0 1 0 12.2 17.5L17 16l11.2-4.5A13 13 0 0 0 16 3z" fill="var(--enzyme)"/><circle cx="24" cy="16" r="3.4" fill="var(--phosphate)"/></svg>
    <span>Metabolism in Motion</span>
  </a>
  <nav class="tabs" aria-label="Pathways">
    <a href="#/glycolysis" style="--c:var(--glyco)"><i></i>Glycolysis</a>
    <a href="#/gluconeogenesis" style="--c:var(--gng)"><i></i>Gluconeogenesis</a>
    <a href="#/krebs" style="--c:var(--tca)"><i></i>Krebs cycle</a>
    <a href="#/regulation" style="--c:var(--atp)"><i></i>Regulation</a>
  </nav>
  <button class="theme-btn" id="themeBtn" aria-label="Switch light or dark theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>
<main>
  <section class="page" id="page-glycolysis"></section>
  <section class="page" id="page-gluconeogenesis"></section>
  <section class="page" id="page-krebs"></section>
  <section class="page" id="page-regulation"></section>
</main>
<script>
/* ================= Cofactor semantics ================= */

        if (st.rev) p.setAttribute('marker-start', m); else p.removeAttribute('marker-start');
      });
      st.labelEl.classList.remove('hide');
      st.cofEl?.classList.remove('hide');
      this.dots[i].classList.toggle('done', i <= cur);
      this.dots[i].classList.remove('now');
    });
    const tot = this.ledgerAt(cur);
    d.ledger.forEach(k => {
      const v = tot[k] || 0, c = this.lcells[k], el = c.querySelector('.v');
      el.textContent = v > 0 ? `+${v}` : v < 0 ? `−${-v}` : '0';
      el.className = 'v' + (v > 0 ? ' pos' : v < 0 ? ' neg' : '');
      if (bump && this.lvals[k] !== v) { c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
      this.lvals[k] = v;

  }
  clearFx() { this.L.fx.replaceChildren(); }

  /* ---------- cards ---------- */
  setCard(html) {
    this.card.innerHTML = html;
    this.card.classList.remove('swap'); void this.card.offsetWidth; this.card.classList.add('swap');
  }
  showIntro() {
    const d = this.def;
    this.setCard(`
      <div class="meta"><span class="badge">${d.steps.length} steps</span><span class="badge">${d.steps.filter(s => s.ctrl).length} control points</span></div>
      <h2>How to use this map</h2>
      <p>Press <b>Play</b> to watch each enzyme grab its substrate, pull in cofactors, and release products. Use <b>Next</b> and <b>Back</b> to go at your own pace, or use the arrow keys.</p>
      <p class="more">Beads inside each molecule count its carbons (violet) and phosphates (pink). Watch them change as groups are added or lost.</p>
      <div class="eqn">${this.eqnFromText(d.overall)}</div>`);
  }
  showSummary() {
    const d = this.def, tot = this.ledgerAt(d.steps.length - 1);
    const parts = d.ledger.filter(k => tot[k]).map(k => `${tot[k] > 0 ? '+' : '−'}${Math.abs(tot[k])} ${k}`).join(', ');
    this.dots.forEach(b => b.classList.remove('now'));
    this.setCard(`
      <div class="meta"><span class="badge rev">Pathway complete</span></div>
      <h2>${d.summary.title}</h2>
      <p>${d.summary.body}</p>
      <div class="eqn">${this.eqnFromText(d.overall)}</div>
      <p class="more">Net change counted on this map: ${parts || 'none'}.</p>`);
  }
  eqnFromText(t) {
    return esc(t).replace(/(\d+ )?(NADH|NAD⁺|FADH₂|FAD|ATP|ADP|GTP|GDP|Pᵢ|H₂O|CO₂|H⁺|CoA-SH)/g,
      (m, q, n) => `<span class="cof" style="--c:var(--${COF[n].k})">${m}</span>`).replace('→', '<span class="arrow">→</span>');
  }
  showStep(i) {
    const st = this.def.steps[i], d = this.def, m = st.mult;
    const name = id => esc(d.nodes[id].label.replace('\n', ' '));
    const lhs = [...st.from.map(n => (m > 1 ? m + ' ' : '') + name(n)), ...st.in.map(([c, q]) => cofSpan(c, q * m))];
    const rhs = [...st.to.map(n => (m > 1 ? m + ' ' : '') + name(n)), ...st.out.map(([c, q]) => cofSpan(c, q * m))];
    const badges = [
      `<span class="badge">Step ${i + 1} of ${d.steps.length}</span>`,
      st.rev ? '<span class="badge rev">Reversible</span>' : '<span class="badge irr">Irreversible</span>',
      `<span class="badge">${st.loc}</span>`,
      st.ctrl ? '<span class="badge ctl">Control point</span>' : '',
      st.bypass ? `<span class="badge byp">${st.bypass}</span>` : '',
      st.branch ? '<span class="badge">Side branch</span>' : ''
    ].join('');
    const dg = st.dg != null ? `<dl><div><dt>ΔG′°</dt><dd>${st.dg > 0 ? '+' : st.dg < 0 ? '−' : ''}${Math.abs(st.dg)} kJ/mol</dd></div>${st.dgNote ? `<div><dt>For</dt><dd>${st.dgNote}</dd></div>` : ''}<div><dt>Class</dt><dd>${st.cls}</dd></div></dl>` : `<dl><div><dt>Class</dt><dd>${st.cls}</dd></div></dl>`;
    this.setCard(`
      <div class="meta">${badges}</div>
      <h2>${lhs.slice(0, st.from.length).join(' + ')} → ${rhs.slice(0, st.to.length).join(' + ')}</h2>
      <div class="enz">${miniEnzymeSVG(st.ctrl)}<div><b>${esc(st.enzyme)}</b><small>${st.ec}</small></div></div>
      <div class="eqn">${lhs.join(' + ')} <span class="arrow">${st.rev ? '⇌' : '→'}</span> ${rhs.join(' + ')}</div>
      ${dg}
      <p>${st.what}</p>
      <p class="more">${st.more}</p>
      ${st.reg ? `<div class="reg">${st.reg} <a href="#/regulation">See it in the regulation lab</a></div>` : ''}`);
  }

  /* ---------- navigation ---------- */
  stop() { this.playing = false; this.playBtn.innerHTML = `${ICON.play}Play`; }
  togglePlay() {
    if (this.playing) { this.stop(); return; }
    this.playing = true; this.playBtn.innerHTML = `${ICON.pause}Pause`;
    this.loop();
  }
  async loop() {
    while (this.playing && this.visible) {
      if (this.busy != null) { await sleep(120); continue; }
      const n = this.current + 1;
      if (n >= this.def.steps.length) { this.stop(); this.showSummary(); break; }
      const ok = await this.animateStep(n);
      if (!ok || !this.playing) break;
      await sleep(550 * this.sp);
    }
  }
  next() {
    this.stop();
    const base = this.busy != null ? this.busy : this.current;
    if (base + 1 >= this.def.steps.length) {
      if (this.busy != null) { this.run++; this.clearFx(); this.current = base; this.busy = null; this.applyState(true); }
      this.showSummary(); return;
    }
    this.goTo(base + 1, true, true);
  }
  prev() {
    this.stop(); this.run++; this.clearFx();
    const base = this.busy != null ? this.busy : this.current;
    this.busy = null;
    this.current = Math.max(-1, base - 1);
    this.applyState(false);
    if (this.current >= 0) { this.showStep(this.current); this.dots[this.current].classList.add('now'); this.focus(this.def.steps[this.current].geo.M); }
    else this.showIntro();
  }
  reset() {
    this.stop(); this.run++; this.clearFx(); this.busy = null; this.current = -1;
    this.applyState(false); this.showIntro();
    this.scroll.scrollTo({top:0, left:0, behavior:reduceMotion ? 'auto' : 'smooth'});
  }
  goTo(i, animate, keepPlaying) {
    if (!keepPlaying) this.stop();
    this.run++; this.clearFx(); this.busy = null;
    this.current = i - 1; this.applyState(false);
    if (animate) this.animateStep(i);
  }
  focus(p) {
    const sc = this.scroll, s = this.svg.clientWidth / this.def.W;
    if (!s) return;
    sc.scrollTo({top:p.y * s - sc.clientHeight / 2, left:p.x * s - sc.clientWidth / 2, behavior:reduceMotion ? 'auto' : 'smooth'});
  }

  /* ---------- live elements ---------- */
  makeTokens(nid, st) {
    const n = this.def.nodes[nid], g = S('g', {class:'token', opacity:0}, this.L.fx);
    const count = st.mult, N = st.geo.N;
    const bodies = [];
    for (let i = 0; i < count; i++) {
      const b = S('g', {}, g);
      S('circle', {r:15, class:'core'}, b);
      this.drawBeads(b, n, {x:0, y:0}, 'ring');
      const off = count > 1 ? V.mul(N, (i - .5) * 26) : {x:0, y:0};
      b.setAttribute('transform', `translate(${off.x} ${off.y}) scale(${count > 1 ? .85 : 1})`);
      bodies.push(b);
    }
    return {
      g,
      move(p, t, fadeOut) {
        g.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);
        const o = fadeOut ? (t > .85 ? (1 - t) / .15 : 1) : Math.min(1, t / .12);
        g.setAttribute('opacity', o.toFixed(2));
      },
      remove() { g.remove(); }
    };
  }
  makeChip(name, q) {
    const info = COF[name] || {k:'muted', s:1};
    const label = (q > 1 ? q + ' ' : '') + name, w = textW(label, 12.5) + 18;
    const g = S('g', {class:'chip', opacity:0}, this.L.fx);
    const inner = S('g', {}, g);
    S('rect', {x:-w / 2, y:-12, width:w, height:24, rx:12,
      style:`fill:${info.s ? `var(--${info.k})` : 'var(--panel)'};stroke:var(--${info.k})`}, inner);
    S('text', {x:0, y:4.5, 'text-anchor':'middle', style:`fill:${info.s ? 'var(--panel)' : `var(--${info.k})`}`}, inner).textContent = label;
    return {
      g,
      set(p, sc, o) { g.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${sc.toFixed(3)})`); g.setAttribute('opacity', o.toFixed(2)); },
      remove() { g.remove(); }
    };
  }
  makeEnzyme(st) {
    const {E, M, N} = st.geo;
    const outer = S('g', {class:'enzyme-live' + (st.ctrl ? ' ctrl' : ''), transform:`translate(${E.x} ${E.y})`}, this.L.fx);
    const scale = S('g', {transform:'scale(0)'}, outer);
    S('circle', {r:44, class:'ring'}, scale);
    const rot = S('g', {}, scale);
    const baseAng = Math.atan2(M.y - E.y, M.x - E.x) * 180 / Math.PI;
    const blob = S('path', {class:'blob', d:blobPath(32, 30)}, rot);
    S('ellipse', {class:'blob-hi', cx:-10, cy:-12, rx:11, ry:7, transform:'rotate(-30)'}, rot);
    rot.setAttribute('transform', `rotate(${baseAng})`);
    const lines = wrap2(st.enzyme);
    const w = Math.max(...lines.map(l => textW(l, 12.5))) + 22, h = 12 + lines.length * 15;
    const pillC = V.mul(N, 50 + Math.abs(N.x) * w / 2 + Math.abs(N.y) * h / 2);
    const pill = S('g', {class:'pill', transform:`translate(${pillC.x} ${pillC.y})`}, scale);
    S('rect', {x:-w / 2, y:-h / 2, width:w, height:h, rx:h / 2 > 14 ? 12 : h / 2}, pill);
    lines.forEach((ln, i) => S('text', {x:0, y:-h / 2 + 18 + i * 15, 'text-anchor':'middle'}, pill).textContent = ln);
    const self = {
      outer, rot,
      scale(s) { scale.setAttribute('transform', `scale(${Math.max(0, s).toFixed(3)})`); },
      mouth(m) { blob.setAttribute('d', blobPath(32, m)); },
      async catalyze(sp, alive, fxLayer, P) {
        await tween(200 * sp, t => self.mouth(30 - 26 * t), ease.io, alive);
        outer.classList.add('working');
        const flash = S('circle', {cx:P.x, cy:P.y, r:4, class:'flash'}, fxLayer);
        const sparks = [...Array(8)].map((_, k) => S('line', {class:'flash', 'stroke-linecap':'round'}, fxLayer));
        await tween(520 * sp, (t, raw) => {
          rot.setAttribute('transform', `rotate(${baseAng + Math.sin(raw * Math.PI * 5) * 9 * (1 - raw)})`);
          flash.setAttribute('r', (4 + 36 * t).toFixed(1)); flash.setAttribute('opacity', (1 - t).toFixed(2));
          sparks.forEach((l, k) => {
            const a = k * Math.PI / 4, r0 = 10 + 22 * t, r1 = r0 + 9 * (1 - t);
            l.setAttribute('x1', P.x + r0 * Math.cos(a)); l.setAttribute('y1', P.y + r0 * Math.sin(a));
            l.setAttribute('x2', P.x + r1 * Math.cos(a)); l.setAttribute('y2', P.y + r1 * Math.sin(a));
            l.setAttribute('opacity', (1 - t).toFixed(2));
          });
        }, ease.out, alive);
        flash.remove(); sparks.forEach(s => s.remove());
        outer.classList.remove('working');
        await tween(220 * sp, t => self.mouth(4 + 26 * t), ease.out, alive);
      },
      remove() { outer.remove(); }
    };
    return self;
  }

  /* ---------- the step animation ---------- */
  async animateStep(i) {
    const id = ++this.run, alive = this.alive(id), st = this.def.steps[i], g = st.geo, sp = this.sp, d = this.def;
    this.clearFx(); this.busy = i;
    this.current = i - 1; this.applyState(false);
    this.showStep(i); this.dots[i].classList.add('now');
    this.focus(g.M);
    st.pathEls.forEach(p => {
      p.setAttribute('class', 'edge active');
      p.setAttribute('marker-end', `url(#ah-${d.id}-active)`);
      if (st.rev) p.setAttribute('marker-start', `url(#ah-${d.id}-active)`);
    });
    st.labelEl.classList.add('hide'); st.cofEl?.classList.add('hide');
    st.from.forEach(n => this.nodeEls[n].classList.add('is-sub'));

    const enz = this.makeEnzyme(st);
    if (!await tween(420 * sp, t => enz.scale(t), ease.back, alive)) return false;

    const subs = st.from.map(nid => {
      const e = st.built.find(b => b.spec.f === nid) || st.built[0], n = d.nodes[nid];
      return {r:route([seg(n, e.pointAt(0)), part(e, 0, e.te), seg(e.pointAt(e.te), g.P)]), tk:this.makeTokens(nid, st)};
    });
    const ins = st.in.map(([n, q]) => this.makeChip(n, q * st.mult));
    const inMoves = ins.map((c, k) => {
      const start = V.add(V.add(g.M, V.mul(g.O, g.cd)), V.mul(g.T, -(g.shift + k * 40)));
      const ctrl = V.add(V.add(g.M, V.mul(g.O, g.cd * .3)), V.mul(g.T, -g.shift * .5));
      return tween(900 * sp, (t, raw) => c.set(quad(start, ctrl, g.P, t), 1 - .5 * t, Math.min(1, raw / .15) * (raw > .9 ? (1 - raw) / .1 : 1)), ease.io, alive);
    });
    const ok1 = await Promise.all([
      ...subs.map(s => tween(1000 * sp, (t, raw) => s.tk.move(s.r(t), raw), ease.io, alive)),
      ...inMoves
    ]);
    if (ok1.includes(false)) return false;
    st.from.forEach(n => this.nodeEls[n].classList.remove('is-sub'));
    ins.forEach(c => c.remove());
    subs.forEach(s => s.tk.g.setAttribute('opacity', '.0'));

    await enz.catalyze(sp, alive, this.L.fx, g.P);
    if (!alive()) return false;
    subs.forEach(s => s.tk.remove());

    const prods = st.to.map(nid => {
      const e = st.built.find(b => b.spec.t === nid) || st.built[0], n = d.nodes[nid];
      return {nid, r:route([seg(g.P, e.pointAt(e.te)), part(e, e.te, 1), seg(e.pointAt(1), n)]), tk:this.makeTokens(nid, st)};
    });
    const outs = st.out.map(([n, q]) => this.makeChip(n, q * st.mult));
    const outMoves = outs.map((c, k) => {
      const end = V.add(V.add(g.M, V.mul(g.O, g.cd)), V.mul(g.T, g.shift + k * 40));
      const ctrl = V.add(V.add(g.M, V.mul(g.O, g.cd * .3)), V.mul(g.T, g.shift * .5));
      return tween(900 * sp, (t, raw) => c.set(quad(g.P, ctrl, end, t), .5 + .5 * t, Math.min(1, raw / .1)), ease.out, alive);
    });
    const ok2 = await Promise.all([
      ...prods.map(p => tween(1050 * sp, (t, raw) => p.tk.move(p.r(t), raw, true), ease.io, alive)),
      ...outMoves
    ]);
    if (ok2.includes(false)) return false;
    prods.forEach(p => {
      p.tk.remove();
      const el = this.nodeEls[p.nid];
      el.classList.remove('pop'); void el.getBoundingClientRect(); el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 900);
    });
    this.current = i; this.busy = null;
    this.applyState(true);
    this.dots[i].classList.add('now');
    st.labelEl.classList.add('hide');
    await tween(520 * sp, t => {
      enz.scale(1 - t);
      outs.forEach(c => c.g.setAttribute('opacity', (1 - t).toFixed(2)));
    }, ease.io, () => id === this.run);
    enz.remove(); outs.forEach(c => c.remove());
    if (id === this.run) st.labelEl.classList.remove('hide');
    return true;
  }

  /* ---------- visibility ---------- */
  onShow() {
    this.visible = true;
    if (!this.revealed) {
      this.revealed = true;
      if (!reduceMotion) {
        this.def.steps.forEach((st, i) => st.pathEls.forEach(p => {
          const len = p.getTotalLength();
          p.style.setProperty('--len', len);
          p.style.animationDelay = `${i * 70}ms`;
          p.classList.add('draw');
          setTimeout(() => { p.classList.remove('draw'); p.style.animationDelay = ''; }, 1100 + i * 70);
        }));
      }
    }
  }
  onHide() { this.visible = false; this.stop(); this.run++; this.clearFx(); if (this.busy != null) { this.busy = null; this.applyState(false); } }
  onKey(e) {
    if (e.target.closest('input,select,textarea')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); this.next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); this.prev(); }
    else if (e.key === ' ' && !e.target.closest('button,[role="button"]')) { e.preventDefault(); this.togglePlay(); }
  }
}

            <div class="slider">
              <label for="in-${i.k}">${i.name}<span id="lv-${i.k}"></span></label>
              <input type="range" id="in-${i.k}" min="0" max="100" step="1">
              <div class="ends"><span>${i.lo}</span><span>${i.hi}</span></div>
            </div>`).join('')}
          <div class="cascade-wrap">
            <h2 style="font-size:16px;margin-top:6px">Hormone relay to PFK-1</h2>
            <div class="cascade">
              <div class="cstep"><b>cAMP</b>signal<div class="bar"><i id="cb-camp" style="--c:var(--gtp)"></i></div></div>
              <span class="carrow">›</span>
              <div class="cstep"><b>PKA</b>active<div class="bar"><i id="cb-pka" style="--c:var(--gtp)"></i></div></div>
              <span class="carrow">›</span>
              <div class="cstep"><b>PFK-2</b>kinase on<div class="bar"><i id="cb-pfk2" style="--c:var(--glyco)"></i></div></div>
              <span class="carrow">›</span>
              <div class="cstep"><b>F2,6BP</b>level<div class="bar"><i id="cb-f26" style="--c:var(--phosphate)"></i></div></div>
            </div>
          </div>
        </div>
        <div class="panel flux-wrap col-mid">
          <div class="verdict" aria-live="polite"></div>
          <div class="fluxsvg"></div>
        </div>
        <div class="col-right">
          <div class="panel insight" style="margin-bottom:14px"><h2>What the cell is doing</h2><div class="ins"></div></div>
          <div class="panel"><h2>Control enzymes</h2><p class="sub">Green signals are pushing activity up, red are pulling it down.</p><div class="rcards"></div></div>
        </div>
      </div>
      <p class="foot">A qualitative teaching model: activities combine the direction and rough strength of each known effector. The numbers illustrate trends, not measured kinetics, and in a real body these pathways are split between tissues.</p>`;

    this.root.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      this.v = {...PRESETS.find(p => p.id === b.dataset.p).v}; this.preset = b.dataset.p; this.update();
    });
    INPUTS.forEach(i => {
      const el = this.root.querySelector(`#in-${i.k}`);
      el.oninput = () => { this.v[i.k] = el.value / 100; this.preset = null; this.update(); };
    });
    this.preset = 'fed';
    this.buildCards();
    this.buildFlux();
  }
  buildCards() {
    const box = this.root.querySelector('.rcards');
    this.cards = {};
    ['glyco', 'gng', 'tca'].forEach(pth => {
      const g = document.createElement('div'); g.className = 'rgroup'; g.style.setProperty('--c', `var(${PATH_META[pth].c})`);
      g.innerHTML = `<h3>${PATH_META[pth].name}</h3>`;
      ENZ.filter(e => e.path === pth).forEach(e => {
        const c = document.createElement('div'); c.className = 'rcard'; c.style.setProperty('--c', `var(${PATH_META[pth].c})`);
        c.innerHTML = `<div class="rc-top"><b>${e.name}</b><span>0%</span></div><div class="bar"><i></i></div>
          <div class="effs">${e.eff.map(f => `<span class="eff ${f.w > 0 ? 'act' : 'inh'}">${f.w > 0 ? '+' : '−'} ${f.n}</span>`).join('')}</div>
          <p class="rc-note">${e.note}</p>`;
        c.onmouseenter = () => this.highlight(e.id, true); c.onmouseleave = () => this.highlight(e.id, false);
        g.appendChild(c); this.cards[e.id] = c;
      });
      box.appendChild(g);
    });
  }
  buildFlux() {
    const svg = this.fsvg = S('svg', {viewBox:'-40 0 620 700', role:'img', 'aria-label':'Carbon flux between glucose, pyruvate and the Krebs cycle'});
    const lanes = S('g', {}, svg);
    this.paths = {
      glyco:S('path', {class:'lane', d:'M240 64 C165 80 150 110 150 150 L150 350 C150 385 190 402 232 404'}, lanes),
      gng:S('path', {class:'lane', d:'M300 404 C345 402 380 385 380 350 L380 150 C380 110 360 80 294 64'}, lanes),
      pdh:S('path', {class:'lane', d:'M266 424 L266 512'}, lanes),
      tca:S('path', {class:'lane', d:'M266 562 A64 64 0 1 1 265.9 562'}, lanes)
    };
    const mnode = (x, y, t) => {
      const g = S('g', {class:'mnode', transform:`translate(${x} ${y})`}, svg), w = textW(t, 13.5) + 28;
      S('rect', {x:-w / 2, y:-17, width:w, height:34, rx:10}, g);
      S('text', {x:0, y:5, 'text-anchor':'middle'}, g).textContent = t;
    };
    this.pLayer = S('g', {}, svg);
    mnode(266, 46, 'Glucose'); mnode(266, 410, 'Pyruvate'); mnode(266, 530, 'Acetyl-CoA');
    S('text', {x:150, y:26, 'text-anchor':'middle', class:'lab-lane', style:'fill:var(--glyco)'}, svg).textContent = 'Glycolysis ↓';
    S('text', {x:390, y:26, 'text-anchor':'middle', class:'lab-lane', style:'fill:var(--gng)'}, svg).textContent = 'Gluconeogenesis ↑';
    S('text', {x:266, y:630, 'text-anchor':'middle', class:'lab-lane', style:'fill:var(--tca)'}, svg).textContent = 'Krebs cycle';

    const ss = S('g', {transform:'translate(266 250)'}, svg);
    this.seesaw = S('g', {class:'seesaw'}, ss);
    S('line', {x1:-58, y1:0, x2:58, y2:0}, this.seesaw);
    S('circle', {cx:-58, cy:-8, r:8, style:'fill:var(--glyco)'}, this.seesaw);
    S('circle', {cx:58, cy:-8, r:8, style:'fill:var(--gng)'}, this.seesaw);
    S('path', {d:'M-10 16 L10 16 L0 2 Z', style:'fill:var(--muted)'}, ss);
    S('text', {x:0, y:36, 'text-anchor':'middle', class:'lab-small'}, ss).textContent = 'F2,6BP tips the balance';

    const pos = {
      hk:[150, 130, 'L'], pfk:[150, 250, 'L'], pk:[150, 350, 'L'],
      g6pase:[380, 130, 'R'], fbp:[380, 250, 'R'], pepck:[380, 330, 'R'], pc:[380, 386, 'R'],
      pdh:[266, 470, 'R'], cs:[321, 594, 'R'], idh:[321, 658, 'R'], akg:[211, 658, 'L']
    };
    this.gauges = {};
    ENZ.forEach(e => {
      const [x, y, side] = pos[e.id], r = 18, C = 2 * Math.PI * r;
      const g = S('g', {class:'gauge', transform:`translate(${x} ${y})`, tabindex:'0'}, svg);
      S('circle', {r:r + 5, style:'fill:var(--panel)'}, g);
      S('circle', {r, class:'track'}, g);
      const arc = S('circle', {r, class:'arc', transform:'rotate(-90)', 'stroke-dasharray':C.toFixed(2), 'stroke-dashoffset':C.toFixed(2), style:`stroke:var(${PATH_META[e.path].c})`}, g);
      const pct = S('text', {x:0, y:4, 'text-anchor':'middle', class:'pct'}, g);
      const dx = side === 'L' ? -30 : 30, an = side === 'L' ? 'end' : 'start';
      S('text', {x:dx, y:-2, 'text-anchor':an, class:'nm'}, g).textContent = e.name;
      S('text', {x:dx, y:14, 'text-anchor':an, class:'role'}, g).textContent = e.role;
      g.onmouseenter = () => this.highlight(e.id, true); g.onmouseleave = () => this.highlight(e.id, false);
      g.onfocus = () => this.highlight(e.id, true); g.onblur = () => this.highlight(e.id, false);
      this.gauges[e.id] = {g, arc, pct, C};
    });
    this.root.querySelector('.fluxsvg').appendChild(svg);
    this.particles = {glyco:[], gng:[], pdh:[], tca:[]};
    const colors = {glyco:'--glyco', gng:'--gng', pdh:'--tca', tca:'--tca'};
    const counts = {glyco:16, gng:16, pdh:5, tca:12};
    for (const k in this.particles)
      for (let i = 0; i < counts[k]; i++)
        this.particles[k].push({u:i / counts[k], el:S('circle', {r:k === 'tca' ? 4 : 5, style:`fill:var(${colors[k]})`, opacity:0}, this.pLayer)});
    this.flux = {glyco:0, gng:0, pdh:0, tca:0};
  }
  highlight(id, on) {
    this.cards[id].classList.toggle('hl', on);
    this.gauges[id].g.classList.toggle('hl', on);
    if (on && innerWidth > 1250) this.cards[id].scrollIntoView({block:'nearest', behavior:reduceMotion ? 'auto' : 'smooth'});
  }
  signals() {
    const v = this.v;
    const s = {...v, atp:v.energy, amp:1 - v.energy, adp:1 - v.energy, glucagon:1 - v.insulin,
      camp:1 - v.insulin, pka:1 - v.insulin, f26:v.insulin};
    return s;
  }
  activity(e, s) {
    let x = e.bias;
    e.eff.forEach(f => { x += f.w * s[f.s]; });
    if (e.id === 'pepck' || e.id === 'g6pase') x -= 2.2 * s.insulin;
    return sig(x);
  }
  update() {
    const s = this.signals(), act = {};
    ENZ.filter(e => e.id !== 'pk').forEach(e => act[e.id] = this.activity(e, s));
    s.f16 = act.pfk;
    act.pk = this.activity(ENZ.find(e => e.id === 'pk'), s);
    this.act = act; this.s = s;

    INPUTS.forEach(i => {
      this.root.querySelector(`#in-${i.k}`).value = Math.round(this.v[i.k] * 100);
      const x = this.v[i.k];
      this.root.querySelector(`#lv-${i.k}`).textContent = x < .33 ? i.lo : x > .67 ? i.hi : 'Moderate';
    });
    this.root.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === this.preset));
    [['camp', s.camp], ['pka', s.pka], ['pfk2', s.insulin], ['f26', s.f26]].forEach(([k, val]) => {
      this.root.querySelector(`#cb-${k}`).style.width = `${Math.round(val * 100)}%`;
    });

    ENZ.forEach(e => {
      const a = act[e.id], c = this.cards[e.id];
      c.querySelector('.rc-top span').textContent = `${Math.round(a * 100)}%`;
      c.querySelector('.bar i').style.width = `${Math.round(a * 100)}%`;
      c.querySelectorAll('.eff').forEach((el, k) => {
        const f = e.eff[k];
        const w = f.show ? -2.2 : f.w;
        el.classList.toggle('on', Math.abs(w * s[f.s]) > 1.1);
      });
      const gg = this.gauges[e.id];
      gg.arc.setAttribute('stroke-dashoffset', (gg.C * (1 - a)).toFixed(2));
      gg.pct.textContent = Math.round(a * 100);
    });

    const jg = Math.min(act.hk, act.pfk, act.pk);
    const jn = Math.min(act.pc, act.pepck, act.fbp, act.g6pase);
    const jp = act.pdh * (.25 + .75 * jg);
    const jt = Math.min(act.cs, act.idh, act.akg) * Math.min(1, .35 + jp + .5 * s.acoa);
    this.target = {glyco:jg, gng:jn, pdh:jp, tca:jt};
    this.seesaw.style.transform = `rotate(${((act.fbp - act.pfk) * 16).toFixed(1)}deg)`;

    const net = jg - jn;
    let verdict;
    if (jg > .45 && jn > .45) verdict = 'Futile cycle: glucose is being broken down and rebuilt at once, wasting ATP as heat.';
    else if (net > .12) verdict = 'Net glucose breakdown. Glycolysis is outrunning gluconeogenesis.';
    else if (net < -.12) verdict = 'Net glucose production. Gluconeogenesis is running, glycolysis is held back.';
    else verdict = 'Glucose metabolism is idling in both directions.';
    verdict += jt > .5 ? ' The Krebs cycle is turning fast.' : jt < .25 ? ' The Krebs cycle is braked.' : '';
    this.root.querySelector('.verdict').textContent = verdict;
    this.writeInsight(s, act);
  }
  writeInsight(s, act) {
    const out = [];
    const p = (c, t) => out.push(`<p style="--c:var(${c})">${t}</p>`);
    if (s.insulin > .65) p('--glyco', 'Insulin keeps the kinase half of PFK-2 active, so fructose 2,6-bisphosphate is high. That pushes PFK-1 on and holds FBPase-1 off, and it represses the genes for PEPCK and glucose 6-phosphatase.');
    else if (s.insulin < .35) p('--gng', 'Glucagon raises cAMP. PKA phosphorylates PFK-2/FBPase-2, fructose 2,6-bisphosphate falls, and FBPase-1 is released. PKA also switches off liver pyruvate kinase, so PEP is not wasted.');
    if (s.energy < .35) p('--atp', 'Energy is low: AMP activates PFK-1 and blocks FBPase-1, and ADP speeds up isocitrate dehydrogenase. The cell burns fuel to make ATP.');
    else if (s.energy > .75) p('--atp', 'ATP is plentiful. It inhibits PFK-1, pyruvate kinase and isocitrate dehydrogenase, slowing fuel breakdown.');
    if (s.acoa > .65) p('--gng', 'Abundant acetyl-CoA (typically from fat breakdown) switches on pyruvate carboxylase and switches off pyruvate dehydrogenase, sending pyruvate toward glucose instead of the Krebs cycle.');
    if (s.citrate > .65) p('--tca', 'High citrate signals a full Krebs cycle. It inhibits PFK-1 and citrate synthase, and nudges FBPase-1 up.');
    if (s.nadh > .65) p('--redox', 'A high NADH/NAD⁺ ratio brakes pyruvate dehydrogenase and the dehydrogenases of the cycle: there is no NAD⁺ left to accept electrons.');
    if (s.ca > .65) p('--tca', 'Calcium from contraction activates PDH phosphatase, isocitrate dehydrogenase and α-ketoglutarate dehydrogenase, matching ATP supply to muscle work.');
    if (s.g6p > .65) p('--glyco', 'Glucose 6-phosphate is piling up and inhibits hexokinase. (Liver glucokinase is not inhibited this way.)');
    if (!out.length) p('--enzyme', 'All signals are moderate, so each control enzyme sits near the middle of its range. Move a slider to push the system one way.');
    this.root.querySelector('.ins').innerHTML = out.join('');
  }
  tick(now) {
    if (!this.visible) return;
    const dt = Math.min(50, now - (this.last || now)) / 1000; this.last = now;
    for (const k in this.flux) this.flux[k] += (this.target[k] - this.flux[k]) * Math.min(1, dt * 3);
    if (!this.lens) this.lens = Object.fromEntries(Object.entries(this.paths).map(([k, p]) => [k, p.getTotalLength()]));
    const speed = {glyco:.14, gng:.14, pdh:.35, tca:.12};
    for (const k in this.particles) {
      const f = this.flux[k], L = this.lens[k];
      this.particles[k].forEach((pt, i) => {
        pt.u = (pt.u + dt * speed[k] * f * (reduceMotion ? .4 : 1)) % 1;
        const pos = this.paths[k].getPointAtLength(pt.u * L);
        pt.el.setAttribute('cx', pos.x.toFixed(1)); pt.el.setAttribute('cy', pos.y.toFixed(1));
        const edge = Math.min(pt.u, 1 - pt.u) * 10;
        const vis = f > .06 && (i / this.particles[k].length) < .25 + .75 * f;
        pt.el.setAttribute('opacity', vis ? (Math.min(1, edge) * (.35 + .65 * f)).toFixed(2) : 0);
      });
    }
    requestAnimationFrame(t => this.tick(t));
  }
  onShow() { this.visible = true; this.last = 0; requestAnimationFrame(t => this.tick(t)); }
  onHide() { this.visible = false; }
  onKey() {}
}

/* ================= Router and boot ================= */
const views = {
  glycolysis:new PathwayView(document.getElementById('page-glycolysis'), GLYCOLYSIS),
  gluconeogenesis:new PathwayView(document.getElementById('page-gluconeogenesis'), GLUCONEOGENESIS),
  krebs:new PathwayView(document.getElementById('page-krebs'), KREBS),
  regulation:new RegulationLab(document.getElementById('page-regulation'))
};
let active = null;
function route_() {
  const key = (location.hash.match(/#\/(\w+)/) || [])[1];
  const name = views[key] ? key : 'glycolysis';
  if (active && active !== name) { views[active].onHide(); document.getElementById('page-' + active).classList.remove('on'); }
  document.getElementById('page-' + name).classList.add('on');
  document.querySelectorAll('.tabs a').forEach(a => a.getAttribute('href') === '#/' + name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const titles = {glycolysis:'Glycolysis', gluconeogenesis:'Gluconeogenesis', krebs:'Krebs cycle', regulation:'Regulation lab'};
  document.title = `${titles[name]} – Metabolism in Motion`;
  if (active !== name) { active = name; window.scrollTo(0, 0); views[name].onShow(); }
}
addEventListener('hashchange', route_);
document.addEventListener('keydown', e => active && views[active].onKey(e));
route_();

/* theme */
(() => {
  const btn = document.getElementById('themeBtn'), root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('mim-theme'); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  btn.onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('mim-theme', root.dataset.theme); } catch (e) {}
  };
})();
</script>
